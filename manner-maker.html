<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>매너 메이커 - 모바일 최적화</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @font-face {
            font-family: 'Gulim';
            src: local('Gulim'), local('Dotum');
        }
        body {
            font-family: 'Gulim', 'Dotum', sans-serif;
            background-color: #008080;
            user-select: none;
            overflow: hidden; /* 모바일 전용: 전체 스크롤 방지 */
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .win95-shadow {
            box-shadow: 1px 1px 0px rgba(0,0,0,1);
        }
        .win95-border {
            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }
        .win95-border-inset {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            background-color: white;
        }
        .win95-button:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            padding-top: 2px;
            padding-left: 2px;
        }
        .active-tab {
            background-color: #000080 !important;
            color: white !important;
            font-weight: bold;
        }
        @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        .loading-bar-anim {
            animation: load 2s infinite;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 폰트 크기 유지 */
        .text-min { font-size: 14px; }
        .text-base-win { font-size: 16px; }
        .text-title-win { font-size: 18px; }

        /* 모바일 핏을 위한 유틸리티 */
        .fieldset-compact {
            padding: 12px 8px 8px 8px !important;
            margin-top: 8px !important;
        }
    </style>
</head>
<body class="p-2">
    <div id="app" class="max-w-md mx-auto flex flex-col h-full w-full">
        <!-- 상단 뒤로가기 (공간 절약을 위해 높이 축소) -->
        <div id="back-nav" class="hidden mb-2">
            <button onclick="changeStep(1)" class="win95-border win95-button bg-[#c0c0c0] px-3 py-1 text-base-win font-bold flex items-center gap-2">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> 뒤로가기
            </button>
        </div>

        <!-- 메인 윈도우 -->
        <div class="win95-border win95-shadow bg-[#c0c0c0] flex-1 flex flex-col overflow-hidden">
            <!-- 타이틀 바 -->
            <div class="bg-[#000080] px-2 py-1 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <i data-lucide="monitor" class="w-4 h-4 text-white"></i>
                    <span id="win-title" class="text-white text-min font-bold">MannerMaker v2.5</span>
                </div>
                <div class="flex gap-1 opacity-50">
                    <div class="w-4 h-4 bg-[#c0c0c0] border border-white"></div>
                </div>
            </div>

            <!-- 콘텐츠 영역 (내부 스크롤 가능하게 설정) -->
            <div id="content" class="p-2 overflow-y-auto flex-1 no-scrollbar">
                <!-- STEP 1: 입력 화면 -->
                <div id="step-1" class="flex flex-col h-full">
                    <!-- 알림바 축소 -->
                    <div class="flex items-center gap-2 bg-white win95-border-inset p-2 mb-2">
                        <i data-lucide="info" class="w-5 h-5 text-blue-600 shrink-0"></i>
                        <p class="text-min font-bold truncate">정중한 문구 생성기</p>
                    </div>

                    <!-- 01. 사건 유형 -->
                    <fieldset class="fieldset-compact relative border-2 border-white border-t-[#808080] border-l-[#808080]">
                        <legend class="absolute -top-3 left-2 bg-[#c0c0c0] px-1 text-min font-bold flex items-center gap-1">
                            <i data-lucide="file-text" class="w-4 h-4"></i> 유형
                        </legend>
                        <div id="category-grid" class="grid grid-cols-3 gap-1.5">
                            <!-- JS 렌더링 -->
                        </div>
                        <div id="subject-grid" class="flex gap-1.5 mt-2">
                            <!-- JS 렌더링 -->
                        </div>
                    </fieldset>

                    <!-- 02. 대상 -->
                    <fieldset class="fieldset-compact relative border-2 border-white border-t-[#808080] border-l-[#808080]">
                        <legend class="absolute -top-3 left-2 bg-[#c0c0c0] px-1 text-min font-bold flex items-center gap-1">
                            <i data-lucide="user" class="w-4 h-4"></i> 대상
                        </legend>
                        <div id="relation-grid" class="grid grid-cols-3 gap-1.5 mb-2">
                            <!-- JS 렌더링 -->
                        </div>
                        <input type="text" id="recipientName" placeholder="성함 (선택)" class="win95-border-inset w-full px-2 py-1.5 text-base-win outline-none">
                    </fieldset>

                    <!-- 03. 정황 -->
                    <fieldset class="fieldset-compact relative border-2 border-white border-t-[#808080] border-l-[#808080]">
                        <legend class="absolute -top-3 left-2 bg-[#c0c0c0] px-1 text-min font-bold flex items-center gap-1">
                            <i data-lucide="message-square" class="w-4 h-4"></i> 정황
                        </legend>
                        <div id="quick-situations" class="flex flex-wrap gap-1 mb-2">
                            <!-- JS 렌더링 -->
                        </div>
                        <textarea id="additionalInfo" placeholder="상세 상황 입력..." class="win95-border-inset w-full px-2 py-1.5 text-base-win h-16 outline-none resize-none"></textarea>
                    </fieldset>

                    <button onclick="handleGenerate()" class="win95-border win95-button w-full bg-[#c0c0c0] py-3 text-title-win font-bold flex items-center justify-center gap-2 mt-4 shrink-0">
                        생성 실행
                    </button>
                </div>

                <!-- STEP 2: 결과 화면 -->
                <div id="step-2" class="hidden flex flex-col gap-3">
                    <div id="loading-ui" class="py-12 flex flex-col items-center justify-center gap-4">
                        <div class="w-full max-w-[200px] bg-white border-2 border-[#808080] border-t-black border-l-black h-6 relative overflow-hidden">
                            <div class="absolute top-0 left-0 h-full bg-[#000080] loading-bar-anim" style="width: 30%;"></div>
                        </div>
                        <p id="loading-text" class="text-base-win font-bold">생성 중...</p>
                    </div>

                    <div id="result-ui" class="hidden flex flex-col gap-3">
                        <div id="tabs-container" class="flex gap-1 overflow-x-auto no-scrollbar pb-1">
                            <!-- JS 렌더링 -->
                        </div>
                        <div class="win95-border-inset p-3 min-h-[140px] relative">
                            <div id="message-content" class="text-base-win leading-relaxed break-all font-medium"></div>
                        </div>
                        <button onclick="copyCurrentMessage()" class="win95-border win95-button w-full py-3 text-base-win font-bold flex items-center justify-center gap-2">
                            <i data-lucide="copy" class="w-5 h-5"></i> 클립보드 복사
                        </button>

                        <fieldset class="fieldset-compact relative border-2 border-white border-t-[#808080] border-l-[#808080]">
                            <legend class="absolute -top-3 left-2 bg-[#c0c0c0] px-1 text-min font-bold">수정</legend>
                            <div class="flex gap-1">
                                <input type="text" id="retryInput" placeholder="피드백 입력..." class="win95-border-inset flex-1 px-2 py-1.5 text-base-win outline-none">
                                <button onclick="handleGenerate(true)" class="win95-border win95-button px-3 bg-[#c0c0c0] text-base-win font-bold">수정</button>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 하단 태스크바 (높이 축소 및 폰트 유지) -->
    <div class="fixed bottom-0 left-0 w-full bg-[#c0c0c0] border-t-2 border-white px-2 py-1.5 flex items-center justify-between z-50">
        <button class="win95-border win95-button flex items-center gap-1.5 px-3 py-1 bg-[#c0c0c0]">
            <div class="bg-[#000080] w-5 h-5 flex items-center justify-center">
                <i data-lucide="monitor" class="text-white w-3 h-3"></i>
            </div>
            <span class="text-base-win font-black italic">Start</span>
        </button>
        <div id="clock" class="px-3 py-0.5 win95-border-inset bg-[#c0c0c0] text-min font-bold">00:00</div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="hidden fixed inset-0 flex items-center justify-center z-[100] bg-black/40 backdrop-blur-[1px]">
        <div class="win95-border bg-[#c0c0c0] w-[240px] p-2">
            <div class="bg-[#000080] px-2 py-1 text-white text-min font-bold">알림</div>
            <div class="text-center py-4 bg-[#c0c0c0]">
                <p class="text-base-win font-bold mb-4">복사 완료!</p>
                <button onclick="closeToast()" class="win95-border win95-button px-8 py-1.5 bg-[#c0c0c0] text-base-win font-bold">확인</button>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'wedding', label: '결혼', emoji: '💍' },
            { id: 'condolence', label: '부고', emoji: '🕯️' },
            { id: 'promotion', label: '승진', emoji: '🏆' },
            { id: 'opening', label: '개업', emoji: '🎊' },
            { id: 'birthday', label: '생일', emoji: '🎂' },
            { id: 'others', label: '기타', emoji: '💬' }
        ];
        const RELATIONS = [
            { id: 'boss', label: '상사' },
            { id: 'colleague', label: '동료' },
            { id: 'friend', label: '친구' },
            { id: 'casual', label: '지인' },
            { id: 'family', label: '가족' },
            { id: 'client', label: '고객' }
        ];
        const QUICK_SITUATIONS = ["축의금", "참석", "불참", "인사"];
        const SUBJECTS = [{ id: 'target', label: '그쪽 소식' }, { id: 'me', label: '나의 홍보' }];
        const LOADING_TEXTS = ["생성 중...", "문장 구성 중...", "조율 중..."];

        let selection = { category: '', relation: '', subject: 'target', additionalInfo: '', recipientName: '' };
        let currentMessages = [];
        let activeTabIndex = 0;

        window.onload = () => {
            renderGrids();
            updateClock();
            setInterval(updateClock, 1000);
            lucide.createIcons();
        };

        function renderGrids() {
            const catGrid = document.getElementById('category-grid');
            catGrid.innerHTML = CATEGORIES.map(cat => `
                <button onclick="selectCategory('${cat.id}')" id="cat-${cat.id}" class="py-2 text-min win95-border bg-[#c0c0c0] font-bold">
                    ${cat.emoji} ${cat.label}
                </button>
            `).join('');

            const subGrid = document.getElementById('subject-grid');
            subGrid.innerHTML = SUBJECTS.map(sub => `
                <button onclick="selectSubject('${sub.id}')" id="sub-${sub.id}" class="flex-1 py-1.5 text-min win95-border ${selection.subject === sub.id ? 'active-tab' : 'bg-[#c0c0c0]'} font-bold">
                    ${sub.label}
                </button>
            `).join('');

            const relGrid = document.getElementById('relation-grid');
            relGrid.innerHTML = RELATIONS.map(rel => `
                <button onclick="selectRelation('${rel.id}')" id="rel-${rel.id}" class="py-1.5 text-min win95-border bg-[#c0c0c0] font-bold">
                    ${rel.label}
                </button>
            `).join('');

            const quickSit = document.getElementById('quick-situations');
            quickSit.innerHTML = QUICK_SITUATIONS.map(sit => `
                <button onclick="setQuickSituation('${sit}')" class="px-2 py-1 bg-white border border-[#808080] text-min font-bold">${sit}</button>
            `).join('');
        }

        function selectCategory(id) {
            selection.category = id;
            CATEGORIES.forEach(c => {
                const el = document.getElementById(`cat-${c.id}`);
                el.classList.remove('active-tab', 'win95-border-inset');
                el.classList.add('win95-border');
            });
            document.getElementById(`cat-${id}`).classList.add('active-tab', 'win95-border-inset');
        }

        function selectSubject(id) {
            selection.subject = id;
            SUBJECTS.forEach(s => document.getElementById(`sub-${s.id}`).classList.remove('active-tab'));
            document.getElementById(`sub-${id}`).classList.add('active-tab');
        }

        function selectRelation(id) {
            selection.relation = id;
            RELATIONS.forEach(r => {
                const el = document.getElementById(`rel-${r.id}`);
                el.classList.remove('active-tab', 'win95-border-inset');
                el.classList.add('win95-border');
            });
            document.getElementById(`rel-${id}`).classList.add('active-tab', 'win95-border-inset');
        }

        function setQuickSituation(text) {
            selection.additionalInfo = text;
            document.getElementById('additionalInfo').value = text;
        }

        function changeStep(step) {
            if(step === 1) {
                document.getElementById('step-1').classList.remove('hidden');
                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('back-nav').classList.add('hidden');
            } else {
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('back-nav').classList.remove('hidden');
            }
        }

        async function handleGenerate(isRetry = false) {
            if (!selection.category || !selection.relation) return;
            
            selection.recipientName = document.getElementById('recipientName').value;
            selection.additionalInfo = document.getElementById('additionalInfo').value;

            changeStep(2);
            document.getElementById('loading-ui').classList.remove('hidden');
            document.getElementById('result-ui').classList.add('hidden');

            const loadingInterval = setInterval(() => {
                document.getElementById('loading-text').innerText = LOADING_TEXTS[Math.floor(Math.random() * LOADING_TEXTS.length)];
            }, 800);

            const apiKey = ""; 
            const systemPrompt = `당신은 예의 바른 문장을 작성하는 전문가입니다. 상황에 맞는 3가지 버전(정중함, 캐주얼, 짧게)의 문구를 JSON 형식으로 응답하세요. { "messages": [ { "type": "정중함", "content": "..." }, ... ] }`;
            const userQuery = isRetry ? `수정사항: ${document.getElementById('retryInput').value}` : `${selection.subject}의 ${selection.category}, ${selection.relation}에게. 이름: ${selection.recipientName}, 추가정황: ${selection.additionalInfo}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const result = await response.json();
                const data = JSON.parse(result.candidates[0].content.parts[0].text);
                currentMessages = data.messages;
                activeTabIndex = 0;
                renderResults();
            } catch (error) {
                document.getElementById('message-content').innerText = "생성 오류. 다시 시도해 주세요.";
            } finally {
                clearInterval(loadingInterval);
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('result-ui').classList.remove('hidden');
            }
        }

        function renderResults() {
            const tabs = document.getElementById('tabs-container');
            tabs.innerHTML = currentMessages.map((msg, idx) => `
                <button onclick="setActiveTab(${idx})" class="shrink-0 px-3 py-1.5 text-min win95-border ${idx === activeTabIndex ? 'active-tab' : 'bg-[#c0c0c0]'} font-bold">
                    ${msg.type}
                </button>
            `).join('');
            document.getElementById('message-content').innerText = currentMessages[activeTabIndex].content;
        }

        function setActiveTab(idx) {
            activeTabIndex = idx;
            renderResults();
        }

        function copyCurrentMessage() {
            const text = currentMessages[activeTabIndex].content;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            document.getElementById('toast').classList.remove('hidden');
        }

        function closeToast() {
            document.getElementById('toast').classList.add('hidden');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
